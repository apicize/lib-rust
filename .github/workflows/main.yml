name: 'publish'

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:

  # init:
  #   name: Initialize project and build environment
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout project
  #       uses: actions/checkout@v4
  #     - name: Install Rust
  #       run: |
  #         curl https://sh.rustup.rs -sSf | sh -s -- -y
  #     - name: Cache initialized setup
  #       uses: actions/cache/save@v4
  #       with:
  #         path: |
  #           ./*
  #           $HOME/.cargo/*
  #         key: ${{ runner.os }}-apicize-lib

  lint:
    name: Lint (Format Check and Clippy)
    runs-on: ubuntu-latest
    # needs: init
    steps:
      # - name: Restore initialized setup
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: |
      #       ./*
      #       $HOME/.cargo/*
      #     key: ${{ runner.os }}-apicize-lib
      #     fail-on-cache-miss: true
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Add Rust to path
        run: . "$HOME/.cargo/env"
      - name: Run format check
        run: cargo fmt --check
      - name: Run lint
        run: cargo clippy

  test:
    name: Unit testing
    runs-on: ubuntu-latest
    # needs: init
    steps:
      # - name: Restore initialized setup
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: |
      #       ./*
      #       $HOME/.cargo/*
      #     key: ${{ runner.os }}-apicize-lib
      #     fail-on-cache-miss: true
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
      - name: Add Rust to path
        run: . "$HOME/.cargo/env"
      - name: Run unit test
        run: cargo test


  verify-version:
    name: Verify tag matches version and changelog
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version and CHANGELOG entry
        run: |
          TAG="${GITHUB_REF_NAME}"
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "Tag:            ${TAG}"
          echo "Cargo version:  ${CRATE_VERSION}"
          if [ "${TAG}" != "${CRATE_VERSION}" ]; then
            echo "::error::Tag '${TAG}' does not match Cargo.toml version '${CRATE_VERSION}'"
            exit 1
          fi
          ESCAPED_VERSION="$(printf '%s' "${CRATE_VERSION}" | sed 's/\./\\./g')"
          if ! grep -qE "^##[[:space:]]+${ESCAPED_VERSION}([[:space:]]|\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing an entry for version '${CRATE_VERSION}'"
            exit 1
          fi
          echo "Tag, Cargo.toml version, and CHANGELOG entry all match."

  publish-crate:
    name: Publish Crate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs:
      - 'verify-version'
      - 'lint'
      - 'test'
    steps:
      # - name: Restore initialized setup
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: |
      #       ./*
      #       $HOME/.cargo/*
      #     key: ${{ runner.os }}-apicize-lib
      #     fail-on-cache-miss: true
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
      - name: Add Rust to path
        run: . "$HOME/.cargo/env"
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build the project
        run: cargo build --release
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish